name: Localization Lockdown

on:
  push:
  pull_request:

jobs:
  localization-lockdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Active enterprise contract suite
        run: node scripts/run-active-contracts.js
      - name: JavaScript syntax validation
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)
